name: Production base checks
on:
  pull_request:
    paths: ['production/**', '.github/workflows/production-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s production/qa -p 'test_workflow.py' -v
      - run: test -f production/data/tasks.json || cp production/data/tasks.example.json production/data/tasks.json
      - run: python production/tools/workflow.py validate
  template-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: production/package-lock.json
      - run: npm ci --prefix production
      - run: npx --prefix production playwright install --with-deps chromium
      - run: node production/qa/template_checks.mjs
