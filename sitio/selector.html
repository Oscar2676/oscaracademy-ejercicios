ista? Convergencia: Una sucesión converge si, a medida que avanzamos hacia el infinito, los números se acercan cada vez más a un valor fijo y específico (un límite). Por ejemplo, la sucesión 1, 1/2, 1/4, 1/8, 1/16, … se hace cada vez más pequeña, \"convergiendo\" hacia el 0 Este concepto es la base para temas más avanzados de la academia como el Polinomio de Taylor. ​",0,""]]}]},{"n":"Divergencia:","c":[{"i":"comp-mu1llzc1","t":"Divergencia:","k":[["comp-mu1llzch","Si los números crecen sin control hacia el infinito (como 2, 4, 8, 16, …) o rebotan sin decidirse por un número (como 1, −1, 1, −1, …), decimos que la sucesión diverge.",0,""]]}]},{"n":"Finanzas y Progresiones Geométricas","c":[{"i":"comp-mtpbf8st","t":"Aplicaciones al cotidiano","k":[["comp-mtpbiqpv","Finanzas y Progresiones Geométricas Cuando depositas dinero en un banco con \"interés compuesto\", tu dinero crece siguiendo una progresión geométrica. Si ganas un 5% anual, cada año tu saldo se multiplica por 1.05. ¡Esa es la razón matemática de por qué las deudas a largo plazo crecen tan rápido!​​",0,""]]}]},{"n":"Deportes y Sucesiones Convergentes","c":[{"i":"comp-mtpqd418","t":"Aplicaciones al cotidiano","k":[["comp-mtpqd4261","​ Deportes y Sucesiones Convergentes Imagina una pelota de tenis que dejas caer desde 2 metros de altura. En cada rebote, alcanza la mitad de la altura anterior (1m, 0.5m, 0.25m...). La distancia total que recorre la pelota es una serie geométrica convergente; aunque rebote infinitas veces, la distancia total que recorrerá no es infinita.",0,""]]}]},{"n":"Problema verbal PA aplicable al cotidiano","c":[{"i":"comp-mtpby28w","t":"Progresión aritmética en lo cotidiano","k":[["comp-mtpby29i","Un teatro está diseñado para que la primera fila tenga 20 asientos, la segunda 22, la tercera 24, y así sucesivamente. ¿Cuántos asientos tendrá la fila número 15?",0,""],["comp-mtpby29i6","Arquitectura",0,""]]}]},{"n":"Ejercicio Numérico de Sucesión","c":[{"i":"comp-mtpbz6iq","t":"Término genera nuqj57","Continuidad en [a,b] y derivabilidad en (a,b).",0,""],["comp-mtnusht4","El Teorema de Rolle (el caso especial donde f(a) = f(b)).",0,""]]}]},{"n":"Aplicación del Teorema del TVM a Caso real","c":[{"i":"comp-lck3z7tm","t":"Aplicación del Teorema del Valor Medio a Caso real","k":[["comp-mtnux8o4","Los radares de tramo en las carreteras. Si entras a una autopista a las 12:00 y sales a las 13:00 recorriendo 120 km, tu velocidad promedio fue de 120 km/h. Aunque hayas frenado o acelerado, el TVM garantiza que en al menos un instante exacto de ese viaje, el velocímetro de tu auto marcó exactamente 120 km/h. Si el límite era 100 km/h, la policía sabe matemáticamente que cometiste una infracción de exceso de velocidad.",2,"Fundamentos de álgebra"]]}]},{"n":"Ejercicio 1 Teo del Valor Medio en fn polinomial","c":[{"i":"comp-lck3z6qv","t":"Teorema del valor medio en una función polinomial","k":[["comp-mtnuzbpf","Poner en práctica el TVM requiere dominar diferentes tipos de álgebra. A continuación, aplicaremos la fórmula f'(c) = (f(b) - f(a))/(b - a) en distintos escenarios:",0,""]]}]},{"n":"Ejercicio 2 Teo del Valor Medio en fn radical","c":[{"i":"comp-lck3z7n0","t":"Teorema del valor medio en una función radical","k":[["comp-mtnv1nrb","Teorema del valor medio para f(x)=√x en [0, 9]",0,""]]}]},{"n":"Ejeercicio 3 Teo del Valor Medio en fn racional","c":[{"i":"comp-lck3z7p5","t":"Ejeercicio 3 Teo del Valor Medio en fn racional","k":[["comp-mtnv3wga","Teorema del valor medio para f(x)=1/x en [1, 3]",0,""]]}]},{"n":"Máximos y mínimos de una función","c":[{"i":"comp-lck3z8aw","t":"Máximos y mínimos de una función","k":[["comp-mtoc674s","Encontrar las \"cimas y valles\" de una curva es fundamental para entender el comportamiento de cualquier fenómeno. Un máximo es el punto más alto que alcanza la función (ya sea en toda su gráfica o en una región cercana), y un mínimo es el más bajo.",0,""],["comp-mtoc750d","Extremos relativos vs. Extremos absolutos",0,""],["comp-mtoc74s1","¿Qué es un Punto Crítico y cómo encontrarlo (f'(x) = 0 o indefinida)?",0,""]]}]},{"n":"Qué es un Punto Crítico y cómo encontrarlo","c":[{"i":"comp-mtocilny","t":"Qué es un Punto Crítico y cómo encontrarlo","k":[["comp-mtocilob","¿Qué es un Punto Crítico y cómo encontrarlo (f'(x) = 0 o indefinida)?",0,""]]}]},{"n":"Aplicación a un Caso Real de un Máximo","c":[{"i":"comp-mtocbd68","t":"Aplicación a un Caso Real de un Máximo","k":[["comp-mtocbd715","Medicina y farmacología. Determinar en qué momento exacto la concentración de un medicamento en el torrente sanguíneo de un paciente alcanza su punto máximo (máximo efecto) antes de que el cuerpo comience a eliminarlo.",0,""]]}]},{"n":"¿Qué es un Punto Crítico y cómo encontrarlo","c":[{"i":"comp-mtocd7vv","t":"Máximos y mínimos de una función","k":[["comp-mtocd7w1","¿Qué es un Punto Crítico y cómo encontrarlo (f'(x) = 0 o indefinida)?",0,""]]}]},{"n":"Intervalos de crecimiento y decrecimiento","c":[{"i":"comp-lck3z8h3","t":"Intervalos de crecimiento y decrecimiento","k":[["comp-mtocz234","¿Cómo sabemos si una función va \"cuesta arriba\" o \"cuesta abajo\" sin necesidad de graficarla? La primera derivada actúa como nuestra brújula. Si la derivada es positiva en un intervalo, la función original está creciendo. Si es negativa, está decreciendo.",0,""]]}]},{"n":"Construcción de la tabla de signos","c":[{"i":"comp-mtod23yy","t":"Construcción de la tabla de signos","k":[["comp-mtod37g9","Tabla de signos de f′ en un modelo de ventas",0,""]]}]},{"n":"Concavidad y puntos de inflexión","c":[{"i":"comp-lck3zahj","t":"Concavidad y puntos de inflexión","k":[["comp-mtod952z","Mientras la primera derivada nos dice si subimos o bajamos, la segunda derivada nos dice cómo es la curva de ese camino. Si la forma es de \"taza hacia arriba\", es cóncava hacia arriba; si es de \"taza hacia abajo\", es cóncava hacia abajo. El punto exacto donde la curva cambia de una forma a otra se llama Punto de Inflexión.",0,""]]}]},{"n":"Criterio de la 2ª derivada para la concavidad","c":[{"i":"comp-lck3zan61","t":"Criterio de la segunda derivada para la concavidad","k":[["comp-mtodc6t2","​​​ Prueba de la Segunda Derivada para la concavidad (f''(x) > 0 vs f''(x) < 0).​",0,""]]}]},{"n":"Aplicación a Caso Real de Concavidad","c":[{"i":"comp-mtodiehw","t":"Aplicación a Caso Real de Concavidad","k":[["comp-mtodiei36","​​​ Epidemiología. Durante un brote de un virus, el número total de contagios siempre crece. Sin embargo, el \"punto de inflexión\" ocurre el día en que la velocidad de nuevos contagios deja de acelerar y comienza a frenar. ¡Ese es el día en que se \"aplana la curva\"!",0,""]]}]},{"n":"Criterios de la 1ª y 2ª Derivada para extremos","c":[{"i":"comp-lck3zany1","t":"Criterios de la Primera y Segunda Derivada para extremos","k":[["comp-mtoe6mzx","Existen dos herramientas (criterios) para confirmar si un punto crítico es un máximo o un mínimo:",0,""],["comp-mtoe9no8","Criterios de la Primera Derivada",0,""],["comp-mtoef2kz","Criterio de la 1ª Derivada: Observamos el entorno. Si la pendiente pasa de positiva a negativa, cruzamos la cima de una montaña (máximo). Si pasa de negativa a positiva, cruzamos el fondo de un valle (mínimo).",0,""],["comp-mtoh8yh7","Criterios de la Segunda Derivada",0,""],["comp-mtoefm3b","Criterio de la 2ª Derivada: Es un método más rápido. Evaluamos el punto crítico en la segunda derivada. Si da positivo (cóncava hacia arriba), es un mínimo. Si da negativo (cóncava hacia abajo), es un máximo.",0,""]]}]}]},{"i":"q9wnq","t":"Derivadas para análisis de funciones · Parte 2","u":"https://www.oscaracademy.org/derivadas-para-análisis-defunciones-parte-2","v":0,"m":[{"n":"Derivadas y optimización","c":[{"i":"comp-mvuyj2er4","t":"Derivadas y optimización","k":[["comp-mvuyj2es5","La optimización consiste en traducir un problema del mundo real a una función matemática y luego usar las derivadas para encontrar su mejor escenario posible: el costo más barato, el área más grande, o la ruta más rápida.",0,""],["comp-mvuyj2et1","Identificación de la función objetivo y las funciones de restricción.",0,""]]}]},{"n":"Identificación de la función objetivo","c":[{"i":"comp-mvuyj2et7","t":"Método de Identificación","k":[["comp-mvuyj2eu6","Identificación de la función objetivo",0,""],["comp-mvuyj2ev3","La Función Objetivo: Es la cantidad exacta que el problema pide maximizar o minimizar. La identificas buscando adjetivos superlativos o verbos de extremo en el enunciado: \"el mayor volumen\", \"el menor costo\", \"el área máxima\", \"la ruta más rápida\". Esta es la ecuación a la que finalmente le calcularás la primera derivada para igualarla a cero.",0,""]]}]},{"n":"Identificación de la función restricción","c":[{"i":"comp-mvuyj2ew3","t":"Método de Identificación","k":[["comp-mvuyj2ex6","Identificación de la función restricción",0,""],["comp-mvuyj2ex12","La Función de Restricción: Es el límite físico, económico o geométrico de la realidad. Si no existiera, podrías hacer la caja infinitamente grande o el costo cero. Se identifica buscando el dato numérico fijo e inamovible que proporciona el problema: \"el granjero tiene exactamente 500 metros de cerca\", \"el envase debe contener 1 litro\". Esta ecuación siempre incluye una constante igualada a tus variables y sirve para despejar una letra e insertarla en la Función Objetivo.",0,""]]}]},{"n":"Aplicación a Caso Real de Optimización","c":[{"i":"comp-mvuyj2ey9","t":"Aplicación a Caso Real de Optimización","k":[["comp-mvuyj2ez6","Diseño industrial y ecología. Imagina que una empresa de bebidas necesita diseñar una lata cilíndrica que contenga exactamente 330 ml de refresco. Utilizando la optimización, se pueden calcular las dimensiones exactas (radio y altura) para fabricar la lata utilizando la menor cantidad de aluminio posible, ahorrando millones de dólares y reduciendo el impacto ambiental.",0,""]]}]},{"n":"El cerco del granjero (Maximizar un Área)","c":[{"i":"comp-mvuyj2f07","t":"El cerco del granjero (Maximizar un Área)","k":[["comp-mvuyj2f2","El cerco del granjero (Maximizar un Área) Un agricultor tiene 1200 metros de alambre y quiere cercar un terreno rectangular adyacente a un río recto (no necesita colocar cerca del lado del río). ¿Qué dimensiones maximizan el área del campo cercado?",0,""]]}]},{"n":"Empaques industriales (Minimizar Material)","c":[{"i":"comp-mvuyj2f33","t":"Empaques industriales (Minimizar Material)","k":[["comp-mvuyj2f45","El cerco del granjero (Maximizar un Área) Un agricultor tiene 1200 metros de alambre y quiere cercar un terreno rectangular adyacente a un río recto (no necesita colocar cerca del lado del río). ¿Qué dimensiones maximizan el área del campo cercado?",0,""]]}]},{"n":"Gráficas de funciones y sus derivadas","c":[{"i":"comp-mvuyj2f51","t":"Gráficas de funciones y sus derivadas","k":[["comp-mvuyj2f65","Aprender a bosquejar la gráfica de una función usando derivadas nos permite prescindir de las calculadoras y comprender verdaderamente la anatomía de una ecuación. Al unir la información de la primera derivada (que nos indica dónde la curva sube o baja) y la de la segunda derivada (que nos dice si la curva tiene forma cóncava o convexa), podemos dibujar a mano el comportamiento exacto de cualquier modelo matemático.",0,""]]}]},{"n":"Diseño de montañas rusas y carreteras","c":[{"i":"comp-mvuyj2f8","t":"Aplicación al cotidiano","k":[["comp-mvuyj2f9","Diseño de montañas rusas y carreteras",0,""],["comp-mvuyj2f96","(Ingeniería Civil)",0,""],["comp-mvuyj2f912","Podemos pensar que las montañas rusas o los enlaces de las autopistas se dibujan a mano alzada, pero en realidad son gráficas de funciones matemáticas cuidadosamente calculadas. Cuando los ingenieros diseñan estos trayectos, necesitan unir diferentes tramos de rieles (por ejemplo, una línea recta que sube y una parábola que baja). Para que los pasajeros no sufran un \"tirón\" brusco o un accidente en el punto de unión, no basta con que las pistas se toquen. Los ingenieros utilizan las derivadas para garantizar que la transición sea perfecta: La función original asegura que las piezas se conecten (continuidad). La primera derivada garantiza que ambas piezas tengan exactamente la misma inclinación en el punto de unión, evitando \"esquinas\" o picos peligrosos. La segunda derivada (la concavidad) se analiza para controlar los cambios bruscos en las fuerzas G que sienten los pasajeros en el estómago al pasar de una curva cóncava a una convexa. Graficar simultáneamente la posición, la primera derivada (velocidad/pendiente) y la segunda derivada (aceleración/concavidad) permite a los diseñadores \"ver\" la seguridad y la fluidez del recorrido en una pantalla mucho antes de construir la primera pieza de acero. NEsta aplicación es excelente porque ayuda a los estudiantes que visiten Oscar Academy a entender por qué nos importa tanto que una gráfica sea \"suave y derivable\", justificando visualmente el cálculo de derivadas para bosquejar curvas.",0,""]]}]},{"n":"Derivada y funciones implícitas","c":[{"i":"comp-mvuyj2fa5","t":"Derivada y funciones implícitas","k":[["comp-mvuyj2fb5","Hasta ahora hemos trabajado con funciones en su \"forma explícita\", donde la variable y está completamente despejada (por ejemplo, y = 2x + 1). Sin embargo, muchas curvas importantes en matemáticas y física, como la ecuación de un círculo (x² + y² = r²), no se pueden despejar fácilmente. La derivación implícita es una técnica poderosa que nos permite calcular la pendiente de estas curvas complejas derivando ambos lados de la ecuación simultáneamente y aplicando la regla de la cadena para la variable dependiente.",0,""]]}]},{"n":"Derivada y funciones implícitas al cotidiano","c":[{"i":"comp-mvuyj2fc4","t":"Derivada y funciones implícitas Aplicación al cotidiano","k":[["comp-mvuyj2fd6","Una forma de conectar este tema con la realidad es pensando en curvas cerradas que no pueden expresarse como una función simple, como es el caso de las elipses y los círculos. Órbitas de satélites y exploración espacial (Ingeniería Aeroespacial) En la vida real, muchos movimientos naturales no siguen el patrón de una función \"típica\" donde una variable depende fácilmente de la otra. Por ejemplo, los planetas, las lunas y los satélites artificiales viajan en órbitas elípticas o circulares. La ecuación matemática de estas trayectorias cerradas (como x² + y² = r²) incluye variables mezcladas; es decir, está en forma implícita. Imagina que los ingenieros de una agencia espacial necesitan ajustar la órbita de un satélite de telecomunicaciones. Para hacerlo sin desperdiciar combustible ni perder el aparato en el espacio, deben encender los propulsores en una dirección matemáticamente perfecta: exactamente paralela a la trayectoria del satélite en ese instante (la recta tangente). ¿Cómo calculan la inclinación exacta de esa recta si la ecuación de la elipse no se puede despejar fácilmente? Usando la derivación implícita. Esta técnica les permite derivar toda la ecuación de la órbita de una sola vez, obteniendo la pendiente exacta en cualquier coordenada (x, y). ¡Es gracias a este cálculo que los propulsores empujan en el ángulo correcto y garantizan las comunicaciones globales! Nota para ti: Esta aplicación es ideal para Oscar Academy porque demuestra a los estudiantes que las matemáticas no son solo letras atrapadas en una pizarra, cumpliendo con la misión de tu academia de brindar educación matemática de calidad y accesible para todos en el mundo. Además, justifica directamente por qué nos tomamos el trabajo de aprender la regla de la cadena para variables que no están despejadas.",0,""]]}]},{"n":"Derivada y función implícita Exploración Espcial","c":[{"i":"comp-mvuyj2fe4","t":"Derivada y función implícita Exploración Espcial","k":[["comp-mvuyj2ff6","Una forma de conectar este tema con la realidad es pensando en curvas cerradas que no pueden expresarse como una función simple, como es el caso de las elipses y los círculos. Órbitas de satélites y exploración espacial (Ingeniería Aeroespacial) En la vida real, muchos movimientos naturales no siguen el patrón de una función \"típica\" donde una variable depende fácilmente de la otra. Por ejemplo, los planetas, las lunas y los satélites artificiales viajan en órbitas elípticas o circulares. La ecuación matemática de estas trayectorias cerradas (como x² + y² = r²) incluye variables mezcladas; es decir, está en forma implícita. Imagina que los ingenieros de una agencia espacial necesitan ajustar la órbita de un satélite de telecomunicaciones. Para hacerlo sin desperdiciar combustible ni perder el aparato en el espacio, deben encender los propulsores en una dirección matemáticamente perfecta: exactamente paralela a la trayectoria del satélite en ese instante (la recta tangente). ¿Cómo calculan la inclinación exacta de esa recta si la ecuación de la elipse no se puede despejar fácilmente? Usando la derivación implícita. Esta técnica les permite derivar toda la ecuación de la órbita de una sola vez, obteniendo la pendiente exacta en cualquier coordenada (x, y). ¡Es gracias a este cálculo que los propulsores empujan en el ángulo correcto y garantizan las comunicaciones globales! Observen que esta aplicación les demuestra que las matemáticas no son sólo letras atrapadas en una pizarra, cumpliendo con nuestra misión de brindar educación matemática de calidad y accesible para todos en el mundo. Además, ya verás cómo es que esto justifica directamente por qué nos tomamos el trabajo de aprender la regla de la cadena para variables que no están despejadas. (Ve a Regla de la Cadena).",0,""]]}]}]},{"i":"gesdq","t":"Ecuaciones diferenciales","u":"https://www.oscaracademy.org/ecuaciones-diferenciales","v":0,"m":[{"n":"Introducción a las ecuaciones diferenciales","c":[{"i":"comp-lclf94pb","t":"Introducción a las ecuaciones diferenciales","k":[["comp-lcxk3mec","Introducción a las ecuaciones diferenciales",0,""],["comp-lcxk5ier","Representar con ecuaciones diferenciales",0,""],["comp-lcxk4zdu","Modelar <script>
(function(){
var D = JSON.parse(document.getElementById('datos').textContent), P = D.P, $ = function(id){ return document.getElementById(id); };
function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var BASE = 'https://oscar2676.github.io/oscaracademy-ejercicios/';
// índice por clave: todos los lugares donde aparece un mismo título
var L = {}, porPag = {};
P.forEach(function(p, pi){ porPag[norm(p.t)] = pi; p.pend = 0; p.tot = 0;
  p.m.forEach(function(m){ m.c.forEach(function(c){ c.k.forEach(function(k){ var key = norm(k[1]); k.push(key); p.tot++; if (k[2] === 0 || k[2] === 3) p.pend++;
    (L[key] = L[key] || []).push({p:p, m:m, c:c, k:k}); }); }); }); });
var sel = {}; try { JSON.parse(localStorage.getItem('oa-selector') || '[]').forEach(function(k){ if (L[k]) sel[k] = 1; }); } catch (e) {}
function guardar(){ try { localStorage.setItem('oa-selector', JSON.stringify(Object.keys(sel))); } catch (e) {} }
var actual = 0, soloPend = false, q = '';
try { var h = decodeURIComponent(location.hash.slice(1)); if (h && porPag[norm(h)] != null) actual = porPag[norm(h)]; } catch (e) {}
function elegible(k){ return k[2] === 0 || k[2] === 3; }
function pintarPags(){ var f = norm($('bp').value);
  $('pags').innerHTML = P.map(function(p, i){ if (f && norm(p.t).indexOf(f) < 0) return ''; return '<li><button data-p="' + i + '"' + (i === actual ? ' aria-current="true"' : '') + '><span>' + esc(p.t) + (p.v ? '' : ' ·') + '</span><span class="n">' + p.pend + ' pend.</span></button></li>'; }).join(''); }
function fila(k){ var st = k[2], key = k[4], n = L[key].length, id = 't' + (fila.n = (fila.n || 0) + 1), lug = n > 1 ? '<span class="lug" title="Este título aparece en ' + n + ' lugares del sitio">×' + n + ' lugares</span>' : '';
  if (st === 1) return '<div class="tit s1"><span class="ico" aria-hidden="true">✓</span><label>' + esc(k[1]) + lug + '</label><span class="e"><a href="' + BASE + esc(k[3]) + '" target="_blank" rel="noopener">hoja publicada</a></span></div>';
  if (st === 2) return '<div class="tit s2"><span class="ico" aria-hidden="true">↪</span><label>' + esc(k[1]) + '</label><span class="e">índice → ' + (porPag[norm(k[3])] != null ? '<button class="linkb" data-ir="' + porPag[norm(k[3])] + '">' + esc(k[3]) + '</button>' : esc(k[3])) + '</span></div>';
  if (st === 4) return '<div class="tit s4"><span class="ico" aria-hidden="true">↗</span><label>' + esc(k[1]) + '</label><span class="e">otro enlace</span></div>';
  return '<div class="tit s' + st + '"><input type="checkbox" id="' + id + '" data-k="' + esc(key) + '"' + (sel[key] ? ' checked' : '') + '><label for="' + id + '">' + esc(k[1]) + lug + '</label><span class="e">' + (st === 3 ? 'ya existe la hoja: falta enlazar' : 'pendiente') + '</span></div>'; }
function pintar(){ var p = P[actual], out = '<h2>' + esc(p.t) + '</h2><p class="sub"><a href="' + esc(p.u) + '" target="_blank" rel="noopener">ver en el sitio</a> · ' + p.pend + ' pendientes de ' + p.tot + ' títulos' + (p.v ? '' : ' · no aparece en el menú del sitio') + '</p>';
  out += '<div class="tools"><label><input type="checkbox" id="sp"' + (soloPend ? ' checked' : '') + '> Solo pendientes</label><label>Buscar título <input id="bt" type="search" value="' + esc(q) + '" style="padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></label></div>';
  out += '<p class="leyenda"><span>☐ pendiente</span><span>✓ ya tiene hoja</span><span>↪ índice: lleva a otra página</span><span>×N: el mismo título en N lugares; se marca una vez y vale para todos</span></p>';
  var nq = norm(q), alguno = false;
  p.m.forEach(function(m){ var cajas = '';
    m.c.forEach(function(c){ var ks = c.k.filter(function(k){ return (!soloPend || elegible(k)) && (!nq || k[4].indexOf(nq) >= 0); }); if (!ks.length) return;
      var pe = c.k.filter(elegible).length;
      cajas += '<div class="caja"><h3><span>' + esc(c.t) + '</span><span class="c">' + pe + ' pendientes de ' + c.k.length + '</span>' + (pe ? '<button data-caja="' + esc(c.i) + '">Marcar caja</button>' : '') + '</h3>' + ks.map(fila).join('') + '</div>'; });
    if (cajas){ alguno = true; out += '<div class="ent">' + esc(m.n || 'Sin nombre') + '</div>' + cajas; } });
  if (!alguno) out += '<p class="vacio">No hay títulos que mostrar con este filtro.</p>';
  $('main').innerHTML = out; $('main').scrollTop = 0; }
function estado(){ var keys = Object.keys(sel), prod = 0, enl = 0, lug = 0; keys.forEach(function(k){ var a = L[k].filter(function(x){ return elegible(x.k); }); lug += a.length; if (L[k].some(function(x){ return x.k[2] === 3; })) enl++; else prod++; });
  $('est').textContent = keys.length ? prod + ' hoja' + (prod === 1 ? '' : 's') + ' por producir' + (enl ? ' · ' + enl + ' solo por enlazar' : '') + ' · ' + lug + ' lugares del sitio' : 'Nada marcado.'; }
function pedido(){ var keys = Object.keys(sel).sort(), prod = [], enl = [];
  keys.forEach(function(k){ var a = L[k].filter(function(x){ return elegible(x.k); }); if (!a.length) return; (a.some(function(x){ return x.k[2] === 3; }) ? enl : prod).push({k:k, a:a}); });
  var hoy = new Date(), f = ('0' + hoy.getDate()).slice(-2) + '-' + ('0' + (hoy.getMonth() + 1)).slice(-2) + '-' + hoy.getFullYear();
  var t = 'PEDIDO DE PRODUCCIÓN · Oscar Academy · ' + f + '\n' + prod.length + ' hojas por producir · ' + enl.length + ' solo por enlazar · ' + prod.concat(enl).reduce(function(s, x){ return s + x.a.length; }, 0) + ' lugares\n';
  function bloque(tit, arr){ if (!arr.length) return; t += '\n' + tit + '\n'; arr.forEach(function(x, i){ t += (i + 1) + '. «' + x.a[0].k[1] + '»' + (x.a[0].k[2] === 3 ? '  → hoja: ' + x.a[0].k[3] : '') + '\n'; x.a.forEach(function(y){ t += '   - ' + y.p.t + ' › ' + y.c.t + '  [' + y.p.i + ' · ' + y.k[0] + ']\n'; }); }); }
  bloque('PRODUCIR (hoja nueva):', prod); bloque('SOLO ENLAZAR (la hoja ya existe):', enl); return t; }
function copiar(){ var t = pedido(), hecho = false; $('txt').value = t;
  function ok(){ $('est').textContent = 'Pedido copiado ✓ Pégalo en el chat de Claude.'; }
  function mano(){ $('dlg').showModal(); $('txt').focus(); $('txt').select(); }
  try { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0'; document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length); hecho = document.execCommand('copy'); document.body.removeChild(ta); } catch (e) {}
  if (hecho){ ok(); return; }
  if (navigator.clipboard && navigator.clipboard.writeText){ try { navigator.clipboard.writeText(t).then(ok, mano); } catch (e) { mano(); } } else mano(); }
$('pags').addEventListener('click', function(e){ var b = e.target.closest('button[data-p]'); if (!b) return; actual = +b.dataset.p; q = ''; try { history.replaceState(null, '', '#' + encodeURIComponent(P[actual].t)); } catch (er) {} pintarPags(); pintar(); });
$('bp').addEventListener('input', pintarPags);
$('main').addEventListener('change', function(e){ var t = e.target; if (t.id === 'sp'){ soloPend = t.checked; pintar(); return; }
  if (t.dataset && t.dataset.k){ if (t.checked) sel[t.dataset.k] = 1; else delete sel[t.dataset.k]; guardar(); estado(); [].forEach.call(document.querySelectorAll('input[data-k]'), function(i){ if (i.dataset.k === t.dataset.k) i.checked = t.checked; }); } });
$('main').addEventListener('input', function(e){ if (e.target.id === 'bt'){ q = e.target.value; var pos = e.target.selectionStart; pintar(); var n = $('bt'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } });
$('main').addEventListener('click', function(e){ var b = e.target.closest('button[data-caja]'), ir = e.target.closest('button[data-ir]');
  if (ir){ actual = +ir.dataset.ir; q = ''; pintarPags(); pintar(); return; }
  if (!b) return; var c = null; P[actual].m.forEach(function(m){ m.c.forEach(function(x){ if (x.i === b.dataset.caja) c = x; }); }); if (!c) return;
  var ks = c.k.filter(elegible), todas = ks.every(function(k){ return sel[k[4]]; }); ks.forEach(function(k){ if (todas) delete sel[k[4]]; else sel[k[4]] = 1; }); guardar(); estado(); pintar(); });
$('limpiar').onclick = function(){ if (!Object.keys(sel).length) return; sel = {}; guardar(); estado(); pintar(); };
$('ver').onclick = function(){ $('txt').value = pedido(); $('dlg').showModal(); }; $('cerrar').onclick = function(){ $('dlg').close(); };
$('copiar').onclick = copiar; $('copiar2').onclick = function(){ $('txt').select(); try { document.execCommand('copy'); } catch (e) {} copiar(); };
$('meta').textContent = 'Árbol del sitio del ' + D.arbol + ' · enlaces leídos el ' + D.enlaces + ' · armado el ' + D.hecho;
pintarPags(); pintar(); estado();
})();
</script></body></html>
