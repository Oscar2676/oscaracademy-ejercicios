<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigonometría · lote 04 | Oscar Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: hoja de estudio en una columna de lectura; la animación es la única pieza con marco. */
:root{
  --bg:#ffffff; --surface:#f7f3f4; --ink:#241a1c; --muted:#6d5f62; --line:#e4d9db;
  --brand:#8a1f2d; --brand-soft:#f3e3e5; --secant:#1f5f8a; --rise:#a85f00; --tangent:#8a1f2d; --alt:#2e6b3e;
  --display:"Fjalla One","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171213; --surface:#211a1c; --ink:#f1e9ea; --muted:#b3a4a7; --line:#3a2e31;
    --brand:#e58a96; --brand-soft:#3a2126; --secant:#7cc0ea; --rise:#f0b45a; --tangent:#e58a96; --alt:#8fd3a0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171213; --surface:#211a1c; --ink:#f1e9ea; --muted:#b3a4a7; --line:#3a2e31;
  --brand:#e58a96; --brand-soft:#3a2126; --secant:#7cc0ea; --rise:#f0b45a; --tangent:#e58a96; --alt:#8fd3a0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.page{max-width:760px;margin:0 auto;padding-block:24px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:28px}
article.sheet{display:flex;flex-direction:column;gap:34px;min-width:0}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
p{margin:0;max-width:66ch}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.9rem,6vw,2.7rem);color:var(--brand)}
h2{font-size:1.5rem;color:var(--brand)}
h3{font-size:1.15rem;letter-spacing:.01em}
a{color:var(--brand)}
.route{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.86rem;color:var(--muted);list-style:none;margin:0;padding:0}
.route li{display:flex;align-items:center;gap:8px}
.route li+li::before{content:"›";color:var(--brand)}
.route b{color:var(--ink);font-weight:600}
.lede{font-size:1.08rem;color:var(--muted)}
.status{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Navegación del lote */
.lote{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:.92rem}
.lote b{font-family:var(--display);font-weight:400;color:var(--brand);font-size:1.05rem;margin-right:6px}
.lote a{text-decoration:none;padding:2px 0;border-bottom:2px solid transparent}
.lote a[aria-current="page"]{border-bottom-color:var(--brand);font-weight:600}
.index{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.index li{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:4px}
.index a{font-family:var(--display);font-size:1.25rem;text-decoration:none}
.index small{color:var(--muted);font-size:.9rem}

/* Animación */
.stage{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.plot{position:relative;width:100%;max-width:600px;margin:0 auto;overflow:hidden;border-radius:4px}
canvas{display:block;width:100%;height:auto;max-width:100%;background:var(--bg)}
.lab{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;font-size:.8rem;line-height:1.2;
  padding:1px 4px;border-radius:3px;background:color-mix(in srgb, var(--bg) 84%, transparent);
  color:var(--ink);transition:opacity .15s;will-change:transform}
.lab.diff{color:var(--rise);font-weight:600}
.lab.pt{font-weight:600}
.lab.c-sec{color:var(--secant)} .lab.c-alt{color:var(--alt)} .lab.c-tan{color:var(--tangent)}
@media (min-width:560px){.lab{font-size:.92rem}}
.caption{font-weight:600;min-height:1.6em}
.readout{min-height:5.6em;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 28px;align-items:center}
.readout>*{min-width:0;overflow-x:auto;overflow-y:hidden}
.readout .d{color:var(--rise)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:3px solid var(--ink);display:inline-block}
.sw.sec{border-color:var(--secant)} .sw.rise{border-color:var(--rise)} .sw.alt{border-color:var(--alt)}
.sw.tan{border-color:var(--tangent)} .sw.dot{border-top-style:dotted}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 20px;align-items:center}
.controls label{display:flex;align-items:center;gap:10px;min-width:0}
.controls input[type=range]{flex:1;min-width:0;accent-color:var(--brand)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 .95rem var(--body);padding:8px 16px;border-radius:4px;border:1px solid var(--brand);background:var(--brand);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--brand)}
button:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--secant);outline-offset:2px}

/* Matemática */
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.4em 0 !important;padding:2px 0}
.def{border-left:4px solid var(--brand);background:var(--brand-soft);padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
.steps li{min-width:0}

/* Ejercicios */
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ex .n{font-family:var(--display);color:var(--brand);margin-right:8px}
details{border:1px solid var(--line);border-radius:4px;padding:6px 12px;min-width:0}
details[open]{background:var(--surface)}
summary{cursor:pointer;font-weight:600;color:var(--brand)}
details>div{padding:6px 0 4px;display:flex;flex-direction:column;gap:6px;min-width:0}
footer{border-top:1px solid var(--line);padding-top:14px;font-size:.88rem;color:var(--muted)}

/* v002: explicaciones paso a paso */
h1 mjx-container{font-size:78% !important}
.keys{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.keys li{min-width:0}
.why{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.why>h3{color:var(--brand)}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 14px;text-align:left;vertical-align:middle}
table.tbl th{font-weight:600;color:var(--muted);font-size:.9rem}
.mnemo{font-family:var(--display);font-size:1.25rem;color:var(--brand);line-height:1.35}
.mnemo b{color:var(--ink);font-weight:400;text-decoration:underline;text-decoration-color:var(--rise);text-underline-offset:4px}
</style>
</head>

</html>
